<html>
<body>
<form method="POST" action="" /cgi-bin/formmail.pl" >
            <input type=hidden name="recipient" value="sanjeev@kuwait-fund.org">
            <input type=hidden name="required" value="name,email,url,description">
            <input type=hidden name="subject" value="Add URL">
            <input type=hidden name="sort" value="order:name,email,url,description">

              <table border="0" cellpadding="0" width="98%">
              <tr>
                <td rowspan="8" width="7"></td>
                <td colspan="3">
                  <font color="#900000" face="Verdana" size="2"><b>Add URL</b></font>
                </td>
              </tr>
              <tr>
                <td bgcolor="#900000" height="1" colspan="3"></td>
              </tr>
              <tr>
                <td width="5" rowspan="6"></td>
              </tr>
              <tr>
                <td align="right"><font face="Verdana" size="1" color="#000000">Your
                  Name :&nbsp;&nbsp;</font> </td>
                <td><input type="text" name="name" size="20"></td>
              </tr>
              <tr>
                <td align="right"><font face="Verdana" size="1" color="#000000">Email-id
                  :&nbsp;&nbsp;</font></td>
                <td><input type="text" name="email" size="20"></td>
              </tr>
              <tr>
                <td align="right"><font face="Verdana" size="1" color="#000000">URL
                  :&nbsp;&nbsp;</font></td>
                <td><input type="text" name="url" size="20"></td>
              </tr>
              <tr>
                <td align="right"><font face="Verdana" size="1" color="#000000">Description
                  :&nbsp;&nbsp;</font></td>
                <td><textarea rows="4" name="description" cols="20"></textarea></td>
              </tr>
              <tr>
                <td colspan="2">
                  <p align="center"><input type="submit" value="Submit" name="B1">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                  <input type="reset" value="Reset" name="B2"></td>
              </tr>
            </table>
            </form>
          </td>
        </tr>
      </table>
</body>
</html>
